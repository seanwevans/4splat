name: CI

on:
  push:
  pull_request:

jobs:
  formatting:
    name: Pre-commit formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          set -eo pipefail
          status=0
          pre-commit run --all-files --show-diff-on-failure || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 1 ] && git diff --quiet; then
            exit 1
          fi
      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply pre-commit formatting"
          git push

  build:
    name: Build with warnings enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build project
        run: gcc -Wall -Wpedantic -std=c11 -o 4splat 4splat.c

  tests:
    name: Unit tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.compiler }}
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build tests
        run: ${{ matrix.compiler }} -Wall -Wpedantic -std=c11 -DUNIT_TEST -o tests/test_4splat tests/test_4splat.c
      - name: Run tests
        run: ./tests/test_4splat

  full-features:
    name: Full-featured build and tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v4
      - name: Install compression libraries and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev \
            libbrotli-dev libzstd-dev liblz4-dev liblcms2-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then sudo apt-get install -y clang; fi
      - name: Build full-featured binary
        run: make CC=${{ matrix.compiler }}
      - name: Build and run full-featured tests
        run: make CC=${{ matrix.compiler }} test

  benchmark:
    name: Benchmark against existing formats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install compression libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev \
            libbrotli-dev libzstd-dev liblz4-dev liblcms2-dev
      - name: Build full-featured binary
        run: make
      - name: Test the harnesses and their reference codecs
        run: |
          pip install pytest
          python3 -m pytest tests/test_benchmark.py tests/test_benchmark_volumes.py -q
      - name: Run the 2D benchmark
        # Exits non-zero if anything that claims to be lossless fails to decode
        # back to the source pixels, so this doubles as a codec round-trip test.
        run: python3 tools/benchmark.py --schemes all --colors 64 --json benchmark.json
      - name: Run the volumetric benchmark
        run: |
          python3 tools/benchmark_volumes.py --schemes all --colors 32 \
            --json benchmark-volumes.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark.json
            benchmark-volumes.json

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone harness (ASan + UBSan)
        run: make fuzz-standalone
      - name: Run over seed corpus and random/mutated inputs
        run: |
          set -e
          mkdir -p rnd
          python3 - <<'PY'
          import os, random, struct
          random.seed(1)
          for i in range(3000):
              open(f'rnd/{i}', 'wb').write(bytes(random.randrange(256)
                                                 for _ in range(random.randrange(0, 400))))
          seed = bytearray(open('tests/fuzz_corpus/valid.4spl', 'rb').read())
          for off in (8, 12, 16, 20, 24, 28):  # width/height/depth/frames/pSize/flags
              m = bytearray(seed); struct.pack_into('<I', m, off, 0xFFFFFFFF)
              open(f'rnd/mut{off}', 'wb').write(m)
          PY
          ASAN_OPTIONS=allocator_may_return_null=1 ./tests/fuzz_read tests/fuzz_corpus/* rnd/*
